; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Every platform package and library is pinned to an exact version so builds stay reproducible
; when the PlatformIO cache is cold.
platform = espressif32@7.1.3
platform_packages =
	platformio/framework-arduinoespressif32@4.20017.260907
	platformio/tool-esptoolpy@2.41100.260830
board = esp32dev
framework = arduino
board_build.embed_txtfiles = data/signing/firmware_signing_public.pem
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_deps = 
	zinggjm/GxEPD2@1.6.4
	; Dependencies of GxEPD2, pinned because GxEPD2 accepts any version
	adafruit/Adafruit GFX Library@1.12.4
	adafruit/Adafruit BusIO@1.17.4
	ricmoo/QRCode@0.0.1
	bblanchon/ArduinoJson@7.4.1
